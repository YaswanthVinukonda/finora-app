<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FINORA"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>FINORA — Personal Finance</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--p:#111a2c;--p2:#1a2941;--line:#293b56;--muted:#91a1bb;--txt:#f3f6fc;--blue:#8db8ff;--green:#70d9a4;--red:#ff8998}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172642,#090e1b 52%);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:90px}.top{position:sticky;top:0;z-index:3;padding:18px;background:#0d1729ed;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:14px;background:#28466f;display:grid;place-items:center;color:#c6ddff;font-size:25px}.brand b{letter-spacing:2px;font-size:20px}.sub,.muted,.meta{color:var(--muted)}.sub{font-size:10px;letter-spacing:1.5px}.toprow,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.controls{display:flex;gap:9px;margin-top:14px}.controls>*{flex:1;min-width:0}.content{padding:17px;display:grid;gap:14px}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#1d3658,#17243b);border:1px solid #385477}.eyebrow{font-size:11px;letter-spacing:1px;color:#b7cbe6;text-transform:uppercase}.big{font-size:31px;font-weight:800;letter-spacing:-1px;margin:8px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat,.tx{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:14px}.stat .v{font-size:19px;font-weight:750;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}h2{font-size:16px;margin:0}.btn,button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:12px;padding:10px 13px;font-weight:650}.primary{background:#35629d;border-color:#527fb9}.danger{color:var(--red)}.smallbtn{font-size:12px;padding:7px 10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#b4c2d7}input,select,textarea{width:100%;min-width:0;background:#0c1423;border:1px solid #34435c;color:var(--txt);padding:11px;border-radius:11px;font:inherit}form{display:grid;grid-template-columns:1fr 1fr;gap:11px}form .wide{grid-column:1/-1}.list{display:grid;gap:9px}.txline{display:flex;justify-content:space-between;gap:12px}.txname{font-weight:700}.meta{font-size:11px;margin-top:3px}.amount{text-align:right;font-weight:750;white-space:nowrap}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}.empty{padding:27px 15px;text-align:center;color:var(--muted);border:1px dashed #34435c;border-radius:16px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0e1728ed;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(18px)}.tabsin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.tab{border:0;background:transparent;color:#91a1bb;font-size:10px;padding:7px 1px;display:grid;justify-items:center;gap:3px;border-radius:11px}.tab i{font-style:normal;font-size:19px}.tab.active{background:#203653;color:#c5dcff}.modalbg{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:92dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.hidden{display:none!important}.note{font-size:12px;padding:11px;background:#142b27;border:1px solid #315b4c;border-radius:12px;color:#b4ecd3}.bar{height:8px;background:#27354b;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#8db8ff}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:15;background:#1b3b32;border:1px solid #39745e;padding:10px 15px;border-radius:12px;display:none}.toast.show{display:block}@media(min-width:620px){.content{padding:22px}.modalbg{align-items:center;padding:20px}.modal{border-radius:22px}}
</style></head><body><div class="app"><header class="top"><div class="row"><div class="brand"><div class="logo">◇</div><div><b>FINORA</b><div class="sub">PERSONAL FINANCE</div></div></div><button class="btn smallbtn" id="backupTop">⇩ Backup</button></div><div class="controls"><select id="base" aria-label="Reporting currency"></select><input id="month" type="month" aria-label="Reporting month"></div></header><main class="content" id="view"></main><nav class="tabs"><div class="tabsin" id="tabs"></div></nav></div><div class="modalbg hidden" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const KEY='finora_local_v1',CS=['SGD','USD','INR','EUR','GBP','AUD','HKD','AED','MYR','JPY','CAD','CHF','NZD','CNY','THB'],CATS=['Food & Dining','Groceries','Transport','Shopping','Housing','Bills & Utilities','Healthcare','Travel','Entertainment','Education','Salary','Business Income','Investment','Dividends','Insurance','Other'];const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),today=()=>new Date().toISOString().slice(0,10),monthNow=()=>today().slice(0,7);const fresh=()=>({transactions:[],wallets:[{id:id(),name:'Cash',currency:'SGD',balance:0},{id:id(),name:'Bank account',currency:'SGD',balance:0}],budgets:[],wealth:[],settings:{base:'SGD'}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}let tab='Home',base=data.settings?.base||'SGD',month=monthNow(),filter='All',search='';const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),fmt=(n,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(+n||0),sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0),mTx=()=>data.transactions.filter(t=>t.date?.startsWith(month)),income=()=>sum(mTx().filter(t=>t.type==='Income')),expense=()=>sum(mTx().filter(t=>t.type==='Expense')),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(a,v)=>a.map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('');const toast=s=>{let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download(new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),'finora-backup-'+today()+'.json')}function txRow(t){return '<article class="tx"><div class="txline"><div><div class="txname">'+esc(t.description)+'</div><div class="meta">'+esc(t.category)+' · '+esc(t.date)+' · '+esc(t.account)+'</div></div><div class="amount '+(t.type==='Income'?'green':'red')+'">'+(t.type==='Income'?'+':'−')+fmt(t.amount,t.currency)+'<div class="meta">'+t.type+'</div></div></div><div class="actions"><button class="btn smallbtn" data-edit="'+t.id+'">Edit</button><button class="btn smallbtn danger" data-del="'+t.id+'">Delete</button></div></article>'}function home(){let curr={};data.transactions.forEach(t=>{curr[t.currency]??={in:0,out:0};curr[t.currency][t.type==='Income'?'in':'out']+=+t.amount});return '<section class="hero"><div class="eyebrow">MONTHLY CASH FLOW · '+month+'</div><div class="big">'+fmt(income()-expense(),base)+'</div><div class="meta">Income minus expenses · '+base+'</div><div class="stats" style="margin-top:15px"><div><span class="green">↙ Income</span><br><b>'+fmt(income(),base)+'</b></div><div><span class="red">↗ Expenses</span><br><b>'+fmt(expense(),base)+'</b></div></div></section><div class="stats"><div class="stat"><div class="meta">Transactions</div><div class="v">'+data.transactions.length+'</div></div><div class="stat"><div class="meta">Savings rate</div><div class="v">'+(income()?((income()-expense())/income()*100).toFixed(1)+'%':'—')+'</div></div></div><div class="row"><h2>Recent activity</h2><button class="btn primary" id="addHome">＋ Add entry</button></div>'+(data.transactions.length?'<div class="list">'+data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txRow).join('')+'</div>':'<div class="empty">Welcome to FINORA. Add your first transaction to start tracking your finances.<br><br><button class="btn primary" id="addFirst">Add first entry</button></div>')+'<section class="card"><h2>Currency breakdown</h2>'+(Object.keys(curr).length?Object.entries(curr).map(([c,v])=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+c+'</b><span class="green">'+fmt(v.in-v.out,c)+'</span><span class="meta">In '+fmt(v.in,c)+' · Out '+fmt(v.out,c)+'</span></div>').join(''):'<p class="meta">Your original-currency totals appear here.</p>')+'</section><p class="meta">Amounts remain in their original currencies. This version does not fetch live exchange rates or convert foreign currencies into '+base+'.</p>'}function transactions(){let a=data.transactions.filter(t=>(filter==='All'||t.type===filter)&&[t.description,t.category,t.account,t.currency].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return '<div class="row"><h2>Transactions</h2><button class="btn primary" id="addTx">＋ Add</button></div><input id="search" placeholder="Search entries…" value="'+esc(search)+'"><select id="filter">'+opts(['All','Expense','Income','Investment'],filter)+'</select>'+(a.length?'<div class="list">'+a.map(txRow).join('')+'</div>':'<div class="empty">No transactions found.</div>')}function wallets(){return '<div class="row"><h2>Wallets & accounts</h2><button class="btn primary" id="addWallet">＋ Add</button></div><div class="note">Balances are manual snapshots. Transactions do not automatically reconcile account balances.</div>'+(data.wallets.map(w=>'<div class="card"><div class="row"><div><b>'+esc(w.name)+'</b><div class="meta">'+w.currency+'</div></div><b>'+fmt(w.balance,w.currency)+'</b></div><div class="actions"><button class="btn smallbtn" data-wedit="'+w.id+'">Edit</button><button class="btn smallbtn danger" data-wdel="'+w.id+'">Remove</button></div></div>').join('')||'<div class="empty">No wallets yet.</div>')}function analytics(){let cats={};mTx().filter(t=>t.type==='Expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);let max=Math.max(1,...Object.values(cats));return '<section class="card"><div class="eyebrow">MONTHLY OVERVIEW</div><div class="big">'+fmt(income()-expense(),base)+'</div><div class="row"><span class="green">Income '+fmt(income(),base)+'</span><span class="red">Expenses '+fmt(expense(),base)+'</span></div></section><section class="card"><h2>Expense categories</h2>'+(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>'<div style="margin:13px 0"><div class="row"><span>'+esc(c)+'</span><b>'+fmt(v,base)+'</b></div><div class="bar"><span style="width:'+v/max*100+'%"></span></div></div>').join('')||'<p class="meta">No expenses recorded for this month.</p>')+'</section><div class="row"><h2>Monthly budgets</h2><button class="btn primary" id="addBudget">＋ Set</button></div>'+(data.budgets.map(b=>{let spent=sum(mTx().filter(t=>t.type==='Expense'&&t.category===b.category&&t.currency===b.currency));return '<div class="card"><div class="row"><b>'+esc(b.category)+'</b><b>'+fmt(spent,b.currency)+' / '+fmt(b.amount,b.currency)+'</b></div><div class="bar"><span style="width:'+Math.min(100,spent/b.amount*100)+'%"></span></div><div class="actions"><button class="btn smallbtn danger" data-bdel="'+b.id+'">Remove</button></div></div>'}).join('')||'<p class="meta">Create budgets to keep spending on track.</p>')}function wealth(){let assets=data.wealth.filter(x=>x.kind!=='Liability'&&x.currency===base).reduce((a,x)=>a+x.value,0),debts=data.wealth.filter(x=>x.kind==='Liability'&&x.currency===base).reduce((a,x)=>a+x.value,0);return '<section class="hero"><div class="eyebrow">NET WORTH · '+base+' ONLY</div><div class="big">'+fmt(assets-debts,base)+'</div><div class="meta">Assets '+fmt(assets,base)+' · Liabilities '+fmt(debts,base)+'</div></section><div class="row"><h2>Assets & liabilities</h2><button class="btn primary" id="addWealth">＋ Add item</button></div>'+(data.wealth.map(w=>'<div class="card"><div class="row"><div><b>'+esc(w.name)+'</b><div class="meta">'+w.kind+' · '+w.currency+'</div></div><b>'+fmt(w.value,w.currency)+'</b></div><div class="actions"><button class="btn smallbtn" data-vdel="'+w.id+'">Delete</button></div></div>').join('')||'<div class="empty">Record savings, investments, property and liabilities here.</div>')+'<section class="card"><h2>Data & privacy</h2><p class="meta">Your records stay in this browser on this device. No cloud account or bank connection.</p><div class="list"><button class="btn" id="csv">Export transactions CSV</button><button class="btn" id="json">Download full JSON backup</button><label class="btn">Restore JSON backup<input id="restore" type="file" accept=".json,application/json" hidden></label><button class="btn danger" id="clear">Delete all local data</button></div><p class="meta">Export backups regularly. Clearing browser data or changing browsers/devices can remove local records.</p></section>'}function render(){document.getElementById('base').innerHTML=opts(CS,base);document.getElementById('base').value=base;document.getElementById('month').value=month;document.getElementById('view').innerHTML=tab==='Home'?home():tab==='Transactions'?transactions():tab==='Wallets'?wallets():tab==='Analytics'?analytics():wealth();document.getElementById('tabs').innerHTML=[['Home','⌂'],['Transactions','⇄'],['Wallets','▣'],['Analytics','▥'],['Wealth','◉']].map(([n,i])=>'<button class="tab '+(tab===n?'active':'')+'" data-tab="'+n+'"><i>'+i+'</i>'+n+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('base').onchange=e=>{base=e.target.value;data.settings.base=base;save();render()};document.getElementById('month').onchange=e=>{month=e.target.value||monthNow();render()};document.getElementById('backupTop').onclick=backup;wire()}function showModal(s){document.getElementById('modal').innerHTML=s;document.getElementById('modalbg').classList.remove('hidden');document.getElementById('close').onclick=()=>document.getElementById('modalbg').classList.add('hidden')}function txForm(t){showModal('<div class="row"><h2>'+(t?'Edit':'New')+' transaction</h2><button class="btn" id="close">✕</button></div><form id="txform"><div class="field"><label>Type</label><select name="type">'+opts(['Expense','Income','Investment'],t?.type||'Expense')+'</select></div><div class="field"><label>Amount</label><input name="amount" type="number" min=".01" step=".01" required value="'+(t?.amount??'')+'"></div><div class="field wide"><label>Description</label><input name="description" required value="'+esc(t?.description||'')+'" placeholder="e.g. Groceries"></div><div class="field"><label>Currency</label><select name="currency">'+opts(CS,t?.currency||base)+'</select></div><div class="field"><label>Category</label><select name="category">'+opts(CATS,t?.category||'Food & Dining')+'</select></div><div class="field"><label>Wallet</label><select name="account">'+opts(data.wallets.map(w=>w.name),t?.account||data.wallets[0]?.name||'')+'</select></div><div class="field"><label>Date</label><input name="date" type="date" required value="'+(t?.date||today())+'"></div><div class="field wide"><label>Notes</label><textarea name="notes">'+esc(t?.notes||'')+'</textarea></div><div class="wide"><button class="btn primary">Save transaction</button></div></form>');document.getElementById('txform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.amount=+d.amount;d.id=t?.id||id();if(t)data.transactions=data.transactions.map(x=>x.id===t.id?d:x);else data.transactions.push(d);save();document.getElementById('modalbg').classList.add('hidden');render();toast('Transaction saved')}}function wire(){let on=(id,fn)=>document.getElementById(id)?.addEventListener('click',fn);on('addHome',()=>txForm());on('addFirst',()=>txForm());on('addTx',()=>txForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>txForm(data.transactions.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this transaction?')){data.transactions=data.transactions.filter(x=>x.id!==b.dataset.del);save();render()}});let s=document.getElementById('search');if(s)s.oninput=e=>{search=e.target.value;let q=search.toLowerCase();document.querySelector('.list')?.replaceChildren(...[]);let a=data.transactions.filter(t=>(filter==='All'||t.type===filter)&&[t.description,t.category,t.account,t.currency].join(' ').toLowerCase().includes(q)).sort((x,y)=>y.date.localeCompare(x.date));document.querySelector('.list')?.insertAdjacentHTML('beforeend',a.map(txRow).join('')||'<div class="empty">No transactions found.</div>');wireRows()};let f=document.getElementById('filter');if(f)f.onchange=e=>{filter=e.target.value;render()};on('addWallet',()=>walletForm());document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(confirm('Remove this wallet?')){data.wallets=data.wallets.filter(w=>w.id!==b.dataset.wdel);save();render()}});document.querySelectorAll('[data-wedit]').forEach(b=>b.onclick=()=>walletForm(data.wallets.find(w=>w.id===b.dataset.wedit)));on('addBudget',()=>budgetForm());document.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=()=>{data.budgets=data.budgets.filter(x=>x.id!==b.dataset.bdel);save();render()});on('addWealth',()=>wealthForm());document.querySelectorAll('[data-vdel]').forEach(b=>b.onclick=()=>{data.wealth=data.wealth.filter(x=>x.id!==b.dataset.vdel);save();render()});on('csv',()=>{let cols=['date','type','description','category','amount','currency','account','notes'];download(new Blob([cols.join(',')+'\n'+data.transactions.map(t=>cols.map(k=>'"'+String(t[k]??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),'finora-transactions.csv')});on('json',backup);on('clear',()=>{if(confirm('Permanently delete all FINORA data on this device?')){data=fresh();save();render()}});document.getElementById('restore')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.transactions)||!Array.isArray(d.wallets))throw 0;if(confirm('Replace current data with this backup?')){data=d;save();base=data.settings?.base||'SGD';render();toast('Backup restored')}}catch{alert('Invalid FINORA backup file')}};r.readAsText(f)})}function wireRows(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>txForm(data.transactions.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete transaction?')){data.transactions=data.transactions.filter(x=>x.id!==b.dataset.del);save();render()}})}function walletForm(w){showModal('<div class="row"><h2>'+(w?'Edit':'Add')+' wallet</h2><button class="btn" id="close">✕</button></div><form id="wf"><div class="field wide"><label>Name</label><input name="name" required value="'+esc(w?.name||'')+'"></div><div class="field"><label>Balance</label><input name="balance" type="number" step=".01" value="'+(w?.balance||0)+'"></div><div class="field"><label>Currency</label><select name="currency">'+opts(CS,w?.currency||base)+'</select></div><div class="wide"><button class="btn primary">Save wallet</button></div></form>');document.getElementById('wf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.balance=+d.balance;if(w)Object.assign(w,d);else data.wallets.push({id:id(),...d});save();document.getElementById('modalbg').classList.add('hidden');render()}}function budgetForm(){showModal('<div class="row"><h2>Monthly budget</h2><button class="btn" id="close">✕</button></div><form id="bf"><div class="field"><label>Category</label><select name="category">'+opts(CATS.filter(x=>!['Salary','Business Income','Dividends'].includes(x)),'Food & Dining')+'</select></div><div class="field"><label>Amount</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Currency</label><select name="currency">'+opts(CS,base)+'</select></div><div class="wide"><button class="btn primary">Save budget</button></div></form>');document.getElementById('bf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.amount=+d.amount;let old=data.budgets.find(x=>x.category===d.category&&x.currency===d.currency);if(old)Object.assign(old,d);else data.budgets.push({id:id(),...d});save();document.getElementById('modalbg').classList.add('hidden');render()}}function wealthForm(){showModal('<div class="row"><h2>Add asset / liability</h2><button class="btn" id="close">✕</button></div><form id="vf"><div class="field wide"><label>Name</label><input name="name" required placeholder="e.g. Stock portfolio"></div><div class="field"><label>Type</label><select name="kind">'+opts(['Cash / savings','Investment','Property','Other asset','Liability'],'Investment')+'</select></div><div class="field"><label>Value</label><input name="value" type="number" min=".01" step=".01" required></div><div class="field"><label>Currency</label><select name="currency">'+opts(CS,base)+'</select></div><div class="wide"><button class="btn primary">Save item</button></div></form>');document.getElementById('vf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.value=+d.value;data.wealth.push({id:id(),...d});save();document.getElementById('modalbg').classList.add('hidden');render()}}render();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script></body></html>
